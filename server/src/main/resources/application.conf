ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.heisthunt.server.ApplicationKt.module ]
    }
}

jwt {
    secret = "heisthunt-jwt-secret-key-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "heisthunt"
    audience = "heisthunt-users"
    realm = "HeistHunt"
    accessTokenExpireMs = 900000  # 15 minutes
    refreshTokenExpireMs = 604800000  # 7 days
}

database {
    driverClassName = "org.postgresql.Driver"
    jdbcURL = "jdbc:postgresql://localhost:5432/heisthunt"
    jdbcURL = ${?DATABASE_URL}
    username = "junhyeong"
    username = ${?DATABASE_USERNAME}
    password = ""
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
}
